name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "18 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept as an artifact rather than uploaded to code scanning.
      #
      # Scorecard reports repository *process* signals — how old the repo is,
      # whether a second person approved the last PR — and several are rated
      # `high`. Feeding those into the code scanning alert stream put them
      # behind the same merge gate as real code findings, where they blocked
      # every pull request and could never be resolved: `Maintained` needs the
      # repo to age, `CodeReview` and `BranchProtection` need an approver a
      # solo repository cannot supply.
      #
      # The score is still worth watching, so the run stays. It just does not
      # get to speak with the authority of a vulnerability.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
