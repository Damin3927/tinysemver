name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights, and
      # signs the provenance attestation. There is no npm token anywhere in this
      # repository: nothing to leak, nothing to rotate.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Pin a trusted-publishing-capable npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci --ignore-scripts

      # Nothing ships that has not passed the full suite on this exact commit.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run verify:package

      - name: Refuse to publish a version that disagrees with the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag ($tag) does not match package.json ($pkg)"
            exit 1
          fi
          echo "version $pkg matches tag"

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --provenance --access public

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance --access public
