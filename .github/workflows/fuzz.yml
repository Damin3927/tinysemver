name: Fuzz

on:
  schedule:
    # Nightly, with a seed that differs per run so coverage accumulates.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "PRNG seed (reproduce a reported failure)"
        type: string
        default: ""
      iterations:
        description: "Iterations per shard"
        type: string
        default: "1000000"

permissions:
  contents: read

jobs:
  soak:
    name: differential fuzz (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Soak
        env:
          # Distinct seed per shard per run; printed by the test so any failure
          # reproduces exactly.
          TINYSEMVER_FUZZ_SEED: ${{ inputs.seed != '' && inputs.seed || format('{0}{1}', github.run_number, matrix.shard) }}
          TINYSEMVER_FUZZ_ITERATIONS: ${{ inputs.iterations || '1000000' }}
        run: node --test test/fuzz.test.ts
